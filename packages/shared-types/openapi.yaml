  /api/v1/users:
    get:
      description: Local PostgreSQL profile cache populated at each login (no passwords). Filter by substring, status and role; keyset pagination by username.
      operationId: listUsers
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
        - description: substring filter over username / display_name / email
          explode: false
          in: query
          name: q
          schema:
            description: substring filter over username / display_name / email
            maxLength: 128
            type: string
        - explode: false
          in: query
          name: status
          schema:
            default: active
            enum:
              - active
              - deleted
              - all
            type: string
        - description: exact role filter, e.g. admin
          explode: false
          in: query
          name: role
          schema:
            description: exact role filter, e.g. admin
            maxLength: 64
            type: string
        - explode: false
          in: query
          name: limit
          schema:
            default: 50
            format: int64
            maximum: 200
            minimum: 1
            type: integer
        - description: "keyset cursor: last username of previous page"
          explode: false
          in: query
          name: cursor
          schema:
            description: "keyset cursor: last username of previous page"
            maxLength: 255
            type: string
