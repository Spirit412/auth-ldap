components:
  schemas:
    DeletedAt:
      additionalProperties: false
      properties:
        Time:
          format: date-time
          type: string
        Valid:
          type: boolean
      required:
        - Time
        - Valid
      type: object
    ErrorDetail:
      additionalProperties: false
      properties:
        location:
          description: Where the error occurred, e.g. 'body.items[3].tags' or 'path.thing-id'
          type: string
        message:
          description: Error message text
          type: string
        value:
          description: The value at the given location
      type: object
    ErrorModel:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ErrorModel.json
          format: uri
          readOnly: true
          type: string
        detail:
          description: A human-readable explanation specific to this occurrence of the problem.
          examples:
            - Property foo is required but is missing.
          type: string
        errors:
          description: Optional list of individual error details
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type:
            - array
            - "null"
        instance:
          description: A URI reference that identifies the specific occurrence of the problem.
          examples:
            - https://example.com/error-log/abc123
          format: uri
          type: string
        status:
          description: HTTP status code
          examples:
            - 400
          format: int64
          type: integer
        title:
          description: A short, human-readable summary of the problem type. This value should not change between occurrences of the error.
          examples:
            - Bad Request
          type: string
        type:
          default: about:blank
          description: A URI reference to human-readable documentation for the error.
          examples:
            - https://example.com/errors/example
          format: uri
          type: string
      type: object
    HealthOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/HealthOutputBody.json
          format: uri
          readOnly: true
          type: string
        status:
          type: string
      required:
        - status
      type: object
    JWK:
      additionalProperties: false
      properties:
        alg:
          type: string
        crv:
          type: string
        e:
          type: string
        kid:
          type: string
        kty:
          type: string
        "n":
          type: string
        use:
          type: string
        x:
          type: string
        "y":
          type: string
      required:
        - kty
        - use
        - alg
        - kid
      type: object
    JwksOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/JwksOutputBody.json
          format: uri
          readOnly: true
          type: string
        keys:
          items:
            $ref: "#/components/schemas/JWK"
          type:
            - array
            - "null"
      required:
        - keys
      type: object
    LdapTestInputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/LdapTestInputBody.json
          format: uri
          readOnly: true
          type: string
        password:
          format: password
          maxLength: 256
          minLength: 1
          type: string
        username:
          description: "логин: короткое имя, DOMAIN\\user или user@UPN"
          maxLength: 128
          minLength: 1
          type: string
      required:
        - username
        - password
      type: object
    LdapTestOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/LdapTestOutputBody.json
          format: uri
          readOnly: true
          type: string
        trace:
          $ref: "#/components/schemas/Trace"
        user:
          $ref: "#/components/schemas/PublicUser"
      required:
        - trace
      type: object
    LogDatesOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/LogDatesOutputBody.json
          format: uri
          readOnly: true
          type: string
        dates:
          items:
            type: string
          type:
            - array
            - "null"
      required:
        - dates
      type: object
    LoginRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/LoginRequest.json
          format: uri
          readOnly: true
          type: string
        password:
          description: AD password; used for Bind only and never stored or logged
          format: password
          maxLength: 256
          minLength: 1
          type: string
        username:
          description: AD login name (sAMAccountName)
          maxLength: 128
          minLength: 1
          type: string
      required:
        - username
        - password
      type: object
    LogsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/LogsOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            additionalProperties: {}
            type: object
          type:
            - array
            - "null"
        next_offset:
          format: int64
          type: integer
      required:
        - items
        - next_offset
      type: object
    PublicUser:
      additionalProperties: false
      properties:
        display_name:
          type: string
        dn:
          type: string
        email:
          type: string
        member_of:
          items:
            type: string
          type:
            - array
            - "null"
        roles:
          items:
            type: string
          type:
            - array
            - "null"
        username:
          type: string
      required:
        - dn
        - username
        - display_name
        - email
        - member_of
        - roles
      type: object
    ReadyOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/ReadyOutputBody.json
          format: uri
          readOnly: true
          type: string
        checks:
          additionalProperties:
            type: string
          type: object
        status:
          type: string
      required:
        - status
        - checks
      type: object
    RefreshRequest:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/RefreshRequest.json
          format: uri
          readOnly: true
          type: string
        refresh_token:
          description: refresh token; required for programmatic clients, optional when the aps_refresh cookie is present
          type: string
      type: object
    SessionItem:
      additionalProperties: false
      properties:
        created_at:
          type: string
        id:
          type: string
        ip:
          type: string
        user_agent:
          type: string
        username:
          type: string
      required:
        - id
        - username
        - created_at
        - user_agent
        - ip
      type: object
    SessionsOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/SessionsOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/SessionItem"
          type:
            - array
            - "null"
        next_cursor:
          type: string
      required:
        - items
      type: object
    SettingsView:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/SettingsView.json
          format: uri
          readOnly: true
          type: string
        admin_group_dn:
          type: string
        base_dn:
          type: string
        bind_dn:
          type: string
        ca_file:
          type: string
        mail_attr:
          type: string
        mode:
          type: string
        name_attr:
          type: string
        netbios_domain:
          type: string
        object_class:
          type: string
        pool_size:
          format: int64
          type: integer
        retry:
          format: int64
          type: integer
        start_tls:
          type: boolean
        timeout:
          type: string
        tls_insecure:
          type: boolean
        upn_suffix:
          type: string
        url:
          type: string
        user_attr:
          type: string
      required:
        - mode
        - url
        - start_tls
        - tls_insecure
        - base_dn
        - object_class
        - user_attr
        - name_attr
        - mail_attr
        - pool_size
        - timeout
        - retry
      type: object
    Step:
      additionalProperties: false
      properties:
        detail:
          type: string
        ms:
          format: int64
          type: integer
        ok:
          type: boolean
        step:
          type: string
      required:
        - step
        - ok
        - ms
      type: object
    Tokens:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/Tokens.json
          format: uri
          readOnly: true
          type: string
        access_token:
          type: string
        expires_in:
          format: int64
          type: integer
        refresh_token:
          type: string
      required:
        - access_token
        - refresh_token
        - expires_in
      type: object
    Trace:
      additionalProperties: false
      properties:
        mode:
          type: string
        ok:
          type: boolean
        steps:
          items:
            $ref: "#/components/schemas/Step"
          type:
            - array
            - "null"
      required:
        - mode
        - ok
        - steps
      type: object
    User:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/User.json
          format: uri
          readOnly: true
          type: string
        created_at:
          format: date-time
          type: string
        deleted_at:
          $ref: "#/components/schemas/DeletedAt"
        display_name:
          type: string
        email:
          type: string
        id:
          type: string
        last_login_at:
          format: date-time
          type:
            - string
            - "null"
        roles:
          items:
            type: string
          type:
            - array
            - "null"
        updated_at:
          format: date-time
          type: string
        username:
          type: string
      required:
        - id
        - username
        - display_name
        - email
        - roles
        - last_login_at
        - created_at
        - updated_at
      type: object
    UsersOutputBody:
      additionalProperties: false
      properties:
        $schema:
          description: A URL to the JSON Schema for this object.
          examples:
            - https://example.com/UsersOutputBody.json
          format: uri
          readOnly: true
          type: string
        items:
          items:
            $ref: "#/components/schemas/User"
          type:
            - array
            - "null"
        next_cursor:
          type: string
      required:
        - items
      type: object
  securitySchemes:
    bearerAuth:
      bearerFormat: JWT
      description: Access token issued by POST /api/v1/auth/login.
      scheme: bearer
      type: http
info:
  description: Centralized AD LDAP authentication proxy issuing JWT pairs (access + rotating refresh) with JWKS publication.
  title: Auth Proxy Service (APS)
  version: dev
openapi: 3.1.0
paths:
  /.well-known/jwks.json:
    get:
      description: Publishes the active signing key (by kid) and previous keys during rotation grace. Clients verify access tokens locally without calling APS.
      operationId: getJwks
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JwksOutputBody"
          description: OK
        default:
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Error
      summary: JSON Web Key Set for local JWT verification
      tags:
        - discovery
  /api/v1/admin/ldap/config:
    get:
      description: Секреты (пароль сервисной учётки) никогда не возвращаются.
      operationId: getLdapConfig
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettingsView"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - bearerAuth: []
      summary: Текущие настройки подключения к LDAP (admin)
      tags:
        - ldap
  /api/v1/admin/ldap/test:
    post:
      description: "Выполняет ту же цепочку, что и вход (TLS → bind → search → атрибуты → роли). Ответ всегда 200 с отчётом: OK или подробный лог отказа. Пароль используется только для bind и не сохраняется."
      operationId: testLdapAuth
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LdapTestInputBody"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LdapTestOutputBody"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
      security:
        - bearerAuth: []
      summary: Проверка авторизации в LDAP с пошаговым отчётом (admin)
      tags:
        - ldap
  /api/v1/admin/logs:
    get:
      description: JSON-строки файла aps-YYYYMMDD.log. Файлы старше LOG_RETENTION_DAYS дней удаляются автоматически.
      operationId: readLogs
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
        - description: дата в формате YYYY-MM-DD; по умолчанию — самый поздний доступный файл
          explode: false
          in: query
          name: date
          schema:
            description: дата в формате YYYY-MM-DD; по умолчанию — самый поздний доступный файл
            maxLength: 10
            minLength: 10
            type: string
        - explode: false
          in: query
          name: offset
          schema:
            default: 0
            format: int64
            minimum: 0
            type: integer
        - explode: false
          in: query
          name: limit
          schema:
            default: 200
            format: int64
            maximum: 1000
            minimum: 1
            type: integer
        - description: фильтр по уровню (после чтения)
          explode: false
          in: query
          name: level
          schema:
            description: фильтр по уровню (после чтения)
            enum:
              - debug
              - info
              - warn
              - error
            type: string
        - description: фильтр по полю event (после чтения)
          explode: false
          in: query
          name: event
          schema:
            description: фильтр по полю event (после чтения)
            maxLength: 64
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogsOutputBody"
          description: OK
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "404":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Not Found
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      security:
        - bearerAuth: []
      summary: Построчное чтение файла лога за дату (admin)
      tags:
        - logs
  /api/v1/admin/logs/dates:
    get:
      operationId: listLogDates
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LogDatesOutputBody"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      security:
        - bearerAuth: []
      summary: Доступные даты файлов логов (admin)
      tags:
        - logs
  /api/v1/auth/login:
    post:
      description: "Verifies credentials via LDAPS bind. Rate limit: 5 attempts / 15 min per IP+username (S-06). User enumeration is prevented (S-08). The refresh token is returned in the body and set as an HttpOnly cookie (S-10)."
      operationId: login
      parameters:
        - description: optional aps_refresh cookie
          in: header
          name: Cookie
          schema:
            description: optional aps_refresh cookie
            type: string
        - description: set by browser clients (anti-CSRF)
          in: header
          name: X-Requested-With
          schema:
            description: set by browser clients (anti-CSRF)
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tokens"
          description: OK
          headers:
            Set-Cookie:
              schema:
                description: aps_refresh (HttpOnly, Secure, SameSite=Strict, Path=/api/v1/auth)
                type: string
        "400":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Bad Request
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "429":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Too Many Requests
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      summary: Authenticate against AD and issue a token pair
      tags:
        - auth
  /api/v1/auth/logout:
    post:
      operationId: logout
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
        - description: aps_refresh cookie to clear
          in: header
          name: Cookie
          schema:
            description: aps_refresh cookie to clear
            type: string
        - in: header
          name: X-Requested-With
          schema:
            type: string
      responses:
        "204":
          description: No Content
          headers:
            Set-Cookie:
              schema:
                description: expired aps_refresh
                type: string
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "403":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Forbidden
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      security:
        - bearerAuth: []
      summary: Revoke the current session and clear the refresh cookie
      tags:
        - auth
  /api/v1/auth/me:
    get:
      operationId: me
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
          description: OK
        "401":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unauthorized
        "422":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Unprocessable Entity
        "500":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Internal Server Error
        "503":
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ErrorModel"
          description: Service Unavailable
      security:
        - bearerAuth: []
      summary: Own profile from the local user cache (no LDAP call)
      tags:
        - auth
  /api/v1/auth/refresh:
    post:
      description: "One-time use: replaying an already-used refresh token revokes the whole session family (S-04). Rate limit: 10/min per user (S-06). Roles are re-read from AD on every refresh (S-12)."
      operationId: refresh
      parameters:
        - description: aps_refresh cookie (browser clients)
          in: header
          name: Cookie
          schema:
            description: aps_refresh cookie (browser clients)
            type: string
        - description: required when the cookie is used
          in: header
          name: X-Requested-With
          schema:
            description: required when the cookie is used
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tokens"
          description: OK
          headers:
            Set-Cookie:
              schema:
                description: rotated aps_refresh
                type: string
        "400":
          content:
