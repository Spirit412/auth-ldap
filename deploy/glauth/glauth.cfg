# Mock AD for local development / integration tests (docker-compose profile "dev").
# PRODUCTION USES A REAL ACTIVE DIRECTORY — this file never leaves the dev stack.

[backend]
  datastore = "config"
  baseDN = "dc=mca,dc=local"

[frontends]
  [frontends.ldap]
    enabled = false
  [frontends.ldaps]
    enabled = true
    listen = "0.0.0.0:636"
    cert = "/config/glauth.crt"
    key = "/config/glauth.key"

# Groups: primary groups place users under ou=<group>; aps-admins grants admin.
[[groups]]
  name = "svc"
  gidnumber = 5500

[[groups]]
  name = "staff"
  gidnumber = 5501

[[groups]]
  name = "aps-admins"
  gidnumber = 6000

# Read-only service account used by APS to search the directory (S-03).
[[users]]
  name = "svc-bind"
  uidnumber = 5000
  primarygroup = 5500
  passsha256 = "b89b701e76aee8d2bc95b43abf0e1fec5a47fc6caea53418c2f9b6bfb19ecce3" # svc-bind-secret
  [[users.capabilities]]
    action = "search"
    object = "*"

# Regular user (no admin role).
[[users]]
  name = "bob"
  uidnumber = 5001
  primarygroup = 5501
  mail = "bob@mca.local"
  passsha256 = "edcef53dda780fb2e0026776ab334023727568fb318b608c8b54f61245e8ad5a" # bob_password

# Admin user (memberOf aps-admins).
[[users]]
  name = "alice"
  uidnumber = 5002
  primarygroup = 5501
  mail = "alice@mca.local"
  passsha256 = "9be51224848ec41f5049fe0a1dbb53a966efa2bd5c6b8296a0fce25ee8d8805f" # alice_password
  memberof = [ 6000 ]
