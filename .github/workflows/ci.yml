name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Format check
        working-directory: apps/api
        run: test -z "$(gofmt -l . | grep -v vendor)" || (gofmt -l . | grep -v vendor && exit 1)
      - name: Vet
        working-directory: apps/api
        run: go vet ./...
      - name: Unit tests
        working-directory: apps/api
        run: go test -race ./...
      # Anti-drift (acceptance #11): committed spec must match the code.
      - name: OpenAPI drift check
        working-directory: apps/api
        run: |
          go run ./cmd/openapi -out /tmp/openapi.yaml
          diff -u /tmp/openapi.yaml ../../packages/shared-types/openapi.yaml

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Regenerate shared types (drift check)
        run: pnpm --filter @aps/shared-types generate
      - name: Lint (tsc)
        run: pnpm --filter @aps/web lint
      - name: Unit tests
        run: pnpm --filter @aps/web test
      - name: Build
        run: pnpm --filter @aps/web build

  integration:
    runs-on: ubuntu-latest
    needs: [api]
    services:
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
      postgres:
        image: postgres:18.6
        ports: ["5432:5432"]
        env:
          POSTGRES_USER: aps
          POSTGRES_PASSWORD: aps-test
          POSTGRES_DB: aps
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-retries 10
    env:
      APS_IT_LDAP_URL: ldaps://localhost:6360
      APS_IT_LDAP_INSECURE: "true"
      APS_IT_LDAP_BIND_DN: cn=svc-bind,ou=svc,dc=mca,dc=local
      APS_IT_LDAP_BIND_PASSWORD: svc-bind-secret
      APS_IT_LDAP_BASE_DN: dc=mca,dc=local
      APS_IT_REDIS_ADDR: localhost:6379
      APS_IT_PG_HOST: localhost
      APS_IT_PG_PASSWORD: aps-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
      - name: Integration tests (glauth + redis + postgres)
        working-directory: apps/api
        run: go test -race -tags=integration ./internal/it -v
