# SPA + API same-origin (S-14): one origin, no CORS.
server {
    listen 80;
    server_name _;
    client_max_body_size 1m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    # API (auth + admin) — forwarded to the Go service.
    # Upstream name = compose service name (auth-ldap-api).
    location /api/ {
        proxy_pass http://auth-ldap-api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
    }

    # JWKS / discovery / docs / health (same upstream).
    location = /.well-known/jwks.json { proxy_pass http://auth-ldap-api:8080; }
    location = /openapi.json          { proxy_pass http://auth-ldap-api:8080; }
    location = /openapi.yaml          { proxy_pass http://auth-ldap-api:8080; }
    location /docs                    { proxy_pass http://auth-ldap-api:8080; }
    location = /health                { proxy_pass http://auth-ldap-api:8080; }
    location = /ready                 { proxy_pass http://auth-ldap-api:8080; }
    location = /metrics               { proxy_pass http://auth-ldap-api:8080; }

    # SPA fallback (TanStack Router deep links).
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    # Internal nginx liveness probe.
    location = /healthz { return 200 'ok'; }
}
